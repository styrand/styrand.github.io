<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  column-gap: 50px;
  row-gap: 50px;  
  grid-template-columns: auto auto auto;
  background-color: dodgerblue;
  padding: 10px;
}

.container div {
  border-radius: 20px;
  background-color: #f1f1f1;
  border: 1px solid black;
  padding: 20px;
  font-size: 30px;
  text-align: center;
}
</style>
</head>
<body>

<p>Use the <em>column-gap</em> property to adjust the space between the grid columns:</p>
